<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy Web Transcoder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #222; color: #fff; height: 100vh; overflow: hidden; }

    /* ヘッダー＆ツールバー */
    #header {
      position: absolute; top: 0; left: 0; right: 0;
      background: #333; padding: 10px; z-index: 100;
      border-bottom: 1px solid #444; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .input-row { display: flex; gap: 8px; margin-bottom: 8px; }
    #url-input {
      flex: 1; height: 38px; padding: 0 12px; font-size: 15px;
      border: 1px solid #555; border-radius: 6px; background: #111; color: #fff;
    }
    .btn {
      height: 38px; padding: 0 16px; font-size: 14px; font-weight: bold;
      background: #007aff; color: #fff; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap;
    }
    .btn-sub { background: #444; border: 1px solid #666; font-weight: normal; }
    
    .mode-row { display: flex; gap: 8px; overflow-x: auto; }
    .mode-btn {
      background: #222; color: #ccc; border: 1px solid #555; padding: 6px 14px;
      border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .mode-btn.active { background: #007aff; color: #fff; border-color: #007aff; font-weight: bold; }

    /* メイン表示エリア */
    #viewer-container { position: absolute; top: 92px; bottom: 0; left: 0; right: 0; overflow: auto; }
    #wrapper { position: relative; min-height: 100%; width: 100%; }

    /* キャプチャ画像 */
    #bg-image { display: block; width: 100%; height: auto; }

    /* 前面：オーバーラップテキスト層 */
    #overlay-panel {
      position: absolute; top: 0; left: 0; width: 100%; min-height: 100%;
      background: rgba(0, 0, 0, 0.75); color: #fff; padding: 20px; font-size: 16px; line-height: 1.6;
      word-wrap: break-word; z-index: 10; transition: opacity 0.2s;
    }
    #overlay-panel a { color: #64b5f6; text-decoration: underline; }
    #overlay-panel p, #overlay-panel h1, #overlay-panel h2, #overlay-panel li { margin-bottom: 12px; }

    /* フローティング操作コントローラー */
    #controls {
      position: fixed; bottom: 15px; right: 15px; z-index: 200;
      background: rgba(0, 0, 0, 0.85); padding: 8px 12px; border-radius: 8px; border: 1px solid #555;
      display: flex; align-items: center; gap: 10px; font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="header">
    <div class="input-row">
      <input type="text" id="url-input" placeholder="検索ワード または URL (例: ヤフー, google.com)">
      <button class="btn" onclick="loadPage()">読み込み</button>
    </div>
    <div class="mode-row">
      <button class="mode-btn active" id="btn-overlap" onclick="setMode('overlap')">🖼️＋📄 重ね合わせ</button>
      <button class="mode-btn" id="btn-text" onclick="setMode('text')">📄 テキスト抽出</button>
      <button class="mode-btn" id="btn-capture" onclick="setMode('capture')">🖼️ キャプチャのみ</button>
    </div>
  </div>

  <div id="viewer-container">
    <div id="wrapper">
      <img id="bg-image" src="" style="display:none;">
      <div id="overlay-panel">
        <p>検索ワードまたはURLを入力して「読み込み」を押してください。</p>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="btn btn-sub" style="height:28px; padding:0 10px; font-size:12px;" onclick="toggleOverlay()">テキスト表示 ON/OFF</button>
    <label>透明度:
      <input type="range" id="opacity-range" min="0" max="100" value="75" oninput="changeOpacity(this.value)">
    </label>
  </div>

  <script>
    var currentMode = 'overlap';

    function resolveUrl(input) {
      input = input.trim();
      if (!input) return '';
      if (input === 'ヤフー' || input === 'yahoo') return 'https://www.yahoo.co.jp/';
      if (input === 'グーグル' || input === 'google') return 'https://www.google.com/';
      if (input.indexOf('http://') === 0 || input.indexOf('https://') === 0) return input;
      if (input.indexOf('.') !== -1 && input.indexOf(' ') === -1) return 'https://' + input;
      return 'https://www.google.com/search?q=' + encodeURIComponent(input);
    }

    function loadPage() {
      var rawInput = document.getElementById('url-input').value;
      var targetUrl = resolveUrl(rawInput);
      if (!targetUrl) return;

      var bgImg = document.getElementById('bg-image');
      var overlay = document.getElementById('overlay-panel');

      overlay.innerHTML = '<p>読み込み中...</p>';
      bgImg.style.display = 'none';

      // 1. キャプチャ画像読み込み
      if (currentMode === 'overlap' || currentMode === 'capture') {
        var captureUrl = 'https://s0.wp.com/mshots/v1/' + encodeURIComponent(targetUrl) + '?w=1024';
        bgImg.src = captureUrl;
        bgImg.onload = function() {
          bgImg.style.display = 'block';
        };
      }

      // 2. 高安定プロキシ (Codetabs CORS Proxy) によるHTML抽出
      if (currentMode === 'overlap' || currentMode === 'text') {
        var proxyUrl = 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(targetUrl);
        
        var xhr = new XMLHttpRequest();
        xhr.open('GET', proxyUrl, true);
        xhr.onload = function() {
          if (xhr.status === 200) {
            parseAndDisplay(xhr.responseText, targetUrl);
          } else {
            overlay.innerHTML = '<p>テキストの取得に失敗しました (Status: ' + xhr.status + ')</p>';
          }
        };
        xhr.onerror = function() {
          overlay.innerHTML = '<p>通信エラーが発生しました。</p>';
        };
        xhr.send();
      }
    }

    function parseAndDisplay(htmlStr, baseUrl) {
      var overlay = document.getElementById('overlay-panel');
      var parser = new DOMParser();
      var doc = parser.parseFromString(htmlStr, 'text/html');

      var removes = doc.querySelectorAll('script, style, noscript, iframe, header, footer, nav');
      for (var i = 0; i < removes.length; i++) {
        removes[i].parentNode.removeChild(removes[i]);
      }

      var links = doc.getElementsByTagName('a');
      for (var j = 0; j < links.length; j++) {
        var href = links[j].getAttribute('href');
        if (href && href.indexOf('http') !== 0 && href.indexOf('javascript') !== 0) {
          try {
            links[j].href = new URL(href, baseUrl).href;
          } catch(e) {}
        }
      }

      overlay.innerHTML = doc.body ? doc.body.innerHTML : 'テキストが見つかりません';
    }

    function setMode(mode) {
      currentMode = mode;
      
      document.getElementById('btn-overlap').className = 'mode-btn' + (mode === 'overlap' ? ' active' : '');
      document.getElementById('btn-text').className = 'mode-btn' + (mode === 'text' ? ' active' : '');
      document.getElementById('btn-capture').className = 'mode-btn' + (mode === 'capture' ? ' active' : '');

      var bgImg = document.getElementById('bg-image');
      var overlay = document.getElementById('overlay-panel');
      var controls = document.getElementById('controls');

      if (mode === 'overlap') {
        bgImg.style.display = 'block';
        overlay.style.display = 'block';
        overlay.style.backgroundColor = 'rgba(0, 0, 0, ' + (document.getElementById('opacity-range').value / 100) + ')';
        controls.style.display = 'flex';
      } else if (mode === 'text') {
        bgImg.style.display = 'none';
        overlay.style.display = 'block';
        overlay.style.backgroundColor = '#222';
        controls.style.display = 'none';
      } else if (mode === 'capture') {
        bgImg.style.display = 'block';
        overlay.style.display = 'none';
        controls.style.display = 'none';
      }
    }

    function toggleOverlay() {
      var overlay = document.getElementById('overlay-panel');
      overlay.style.display = (overlay.style.display === 'none') ? 'block' : 'none';
    }

    function changeOpacity(val) {
      var overlay = document.getElementById('overlay-panel');
      if (currentMode === 'overlap') {
        overlay.style.backgroundColor = 'rgba(0, 0, 0, ' + (val / 100) + ')';
      }
    }
  </script>
</body>
</html>
